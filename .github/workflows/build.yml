name: Build OsamLoad APK

on:
workflow_dispatch:
push:
branches: [main]

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Extract project ZIP
    run: |
      mkdir project
      unzip OsamLoad-GitHub-Project.zip -d project

  - name: Setup Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Setup Android SDK
    uses: android-actions/setup-android@v4

  - name: Setup Gradle
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '8.9'

  - name: Fix Java and Kotlin compatibility
    run: |
      python3 - <<'PY'
      from pathlib import Path

      p = Path("project/app/build.gradle.kts")
      s = p.read_text()

      s = s.replace(
          "    defaultConfig {",
          """    compileOptions {
              sourceCompatibility = JavaVersion.VERSION_17
              targetCompatibility = JavaVersion.VERSION_17
          }
          kotlinOptions {
              jvmTarget = "17"
          }
          defaultConfig {"""
      )

      p.write_text(s)
      PY

  - name: Build APK
    run: |
      cd project
      gradle assembleDebug

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: OsamLoad-APK
      path: project/app/build/outputs/apk/debug/app-debug.apk
